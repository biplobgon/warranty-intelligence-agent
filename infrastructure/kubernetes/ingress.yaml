apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warranty-api
  namespace: warranty-intel
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.warranty-intel.example.com]
      secretName: warranty-api-tls
  rules:
    - host: api.warranty-intel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warranty-api
                port: { number: 80 }
