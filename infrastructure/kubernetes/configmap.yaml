apiVersion: v1
kind: ConfigMap
metadata:
  name: warranty-api-config
  namespace: warranty-intel
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  LLM_PROVIDER: "openai"
  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_EMBED_MODEL: "text-embedding-3-small"
  VECTOR_BACKEND: "pinecone"
  PINECONE_INDEX_WARRANTY: "warranty-claims"
  PINECONE_INDEX_DOCS: "technical-docs"
  REDIS_URL: "redis://warranty-redis:6379/0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "warranty-intel-api"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  ENABLE_GUARDRAILS: "true"
  ENABLE_PII_REDACTION: "true"
  HALLUCINATION_THRESHOLD: "0.65"
  GROUNDING_THRESHOLD: "0.70"
  FEATURE_HYBRID_RETRIEVAL: "true"
  FEATURE_RERANKER: "true"
  FEATURE_MCP_TOOLS: "true"
