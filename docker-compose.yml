# =============================================================
# Warranty Intelligence Agent — Full local stack
# Brings up: API, Redis, Prometheus, Grafana, OTel collector, MLflow.
# =============================================================
version: "3.9"

name: warranty-intel

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: warranty-intel/api:dev
    container_name: warranty-api
    env_file: .env
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - otel-collector
    networks: [warranty-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: warranty-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [warranty-net]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: warranty-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    networks: [warranty-net]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: warranty-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [warranty-net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: warranty-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [warranty-net]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: warranty-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    networks: [warranty-net]

networks:
  warranty-net:
    driver: bridge

volumes:
  redis-data:
  prom-data:
  grafana-data:
  mlflow-data:
